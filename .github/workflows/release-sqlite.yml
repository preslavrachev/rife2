name: release-sqlite

on:
  push:
    tags: ['v*-sqlite']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 17

      - name: Build and test
        run: ./bld download clean compile test jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < src/main/resources/RIFE_VERSION)
          gh release create "v$VERSION" "build/dist/rife2-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "RIFE2 $VERSION" --notes "SQLite fork build" \
            || gh release upload "v$VERSION" "build/dist/rife2-$VERSION.jar" --clobber
